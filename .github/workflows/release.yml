name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend
        run: pnpm run typecheck

      - name: Test frontend
        run: pnpm run test:frontend

      - name: Test backend
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Lint backend
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build Mod Garrison
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MOD_GARRISON_MODIO_API_KEY: ${{ secrets.MOD_GARRISON_MODIO_API_KEY }}
          MOD_GARRISON_MODIO_API_BASE: ${{ vars.MOD_GARRISON_MODIO_API_BASE }}
        with:
          args: --features custom-protocol --bundles nsis
          assetNamePattern: "Mod-Garrison_[version]_[arch][setup][ext]"
          tagName: ${{ github.ref_name }}
          releaseName: "Mod Garrison ${{ github.ref_name }}"
          releaseBody: |
            Mod Garrison ${{ github.ref_name }} for Windows.

            - Adds GameBanana and mod.io discovery, direct-file inspection, and safe supported-archive installation.
            - Adds Steam Workshop visibility for content already downloaded through Steam while leaving subscriptions, downloads, updates, and removal under Steam's control.
            - Shows a provider selector only when the selected game has real mods from that provider; runtime packages do not count as discoverable mods.
            - Automatically resolves exact per-game provider catalogues and caches both positive and negative mappings without asking users to choose domains manually.
            - Loads the visible Discover page first, then indexes large catalogues in bounded background batches so games with thousands of mods no longer freeze the application.
            - Cancels stale discovery work when the profile, provider, search, sort, page, or view changes, and limits pagination to records that have actually been indexed.
            - Displays live indexed-versus-estimated totals while background discovery is still running.
            - Preserves Nexus browser/NXM rules, restricts mod.io direct downloads to eligible free public files, and rejects unsafe provider URLs or payloads.
            - Improves the Discover controls and health/status experience while keeping installed-mod and provider actions responsive during background indexing.
            - Publishes one Windows NSIS `.exe` installer and its SHA-256 checksum.
            - Existing profiles, settings, provider credentials, portable profile bundles, and installation upgrades remain compatible.
          releaseDraft: true
          prerelease: false

      - name: Generate installer checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installers = @(Get-ChildItem "src-tauri/target/release/bundle" -Recurse -File |
            Where-Object { $_.Extension -eq ".exe" })
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows .exe installer, found $($installers.Count)."
          }

          $installer = $installers[0]
          $version = "${{ github.ref_name }}".TrimStart("v")
          $assetName = "Mod-Garrison_${version}_x64-setup.exe"
          $remoteInstallers = @(gh release view "${{ github.ref_name }}" --json assets --jq '.assets[].name' |
            Where-Object { $_ -like "*.exe" })
          if ($remoteInstallers.Count -ne 1 -or $remoteInstallers[0] -ne $assetName) {
            throw "Expected the single release installer '$assetName', found: $($remoteInstallers -join ', ')"
          }

          $checksumDirectory = Join-Path $env:RUNNER_TEMP "mod-garrison-checksum"
          New-Item -ItemType Directory -Path $checksumDirectory -Force | Out-Null
          $checksumPath = Join-Path $checksumDirectory "$assetName.sha256"
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $assetName" | Set-Content -LiteralPath $checksumPath -Encoding ascii
          gh release upload "${{ github.ref_name }}" $checksumPath --clobber

          $expectedAssets = @($assetName, "$assetName.sha256") | Sort-Object
          $actualAssets = @(gh release view "${{ github.ref_name }}" --json assets --jq '.assets[].name') |
            Sort-Object
          if (Compare-Object $expectedAssets $actualAssets) {
            throw "Release assets did not match the expected installer and checksum: $($actualAssets -join ', ')"
          }

      - name: Publish complete release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --latest
