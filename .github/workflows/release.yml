name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend
        run: pnpm run typecheck

      - name: Test frontend
        run: pnpm run test:frontend

      - name: Test backend
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Lint backend
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build Mod Garrison
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --features custom-protocol --bundles nsis
          assetNamePattern: "Mod-Garrison_[version]_[arch][setup][ext]"
          tagName: ${{ github.ref_name }}
          releaseName: "Mod Garrison ${{ github.ref_name }}"
          releaseBody: |
            Mod Garrison ${{ github.ref_name }} for Windows.

            - Makes genuine client and local-server install destinations selectable from both compact and expanded mod-library views.
            - Moves a managed mod to the chosen destination transactionally and retires its previous managed copy, with rollback and recovery protection.
            - Globally limits selectable destinations to canonical, filesystem-verified game routes; provider descriptions cannot invent install authority.
            - Requires unknown Unreal games to prove a `Content/Paks` root with direct native `.pak`, `.ucas`, or `.utoc` payload, while known games use exact registered routes.
            - Fixes Windrose so only `R5/Content/Paks/~mods` and `R5/Builds/WindowsServer/R5/Content/Paks/~mods` are offered.
            - Automatically removes stale or generated target choices from existing installs while preserving the active receipt, selected valid route, files, hashes, backups, and configuration ownership.
            - Rejects tampered target IDs and paths, prunes nested mod/cache/backup trees from route discovery, and fails closed when saved choices cannot be safely rebuilt.
            - Preserves verified user-edited configuration files across target changes and strengthens target-specific dependency checks.
            - Publishes one Windows NSIS `.exe` installer and its SHA-256 checksum.
            - Existing profiles, settings, Nexus credentials, portable profile bundles, and installation upgrades remain compatible.
          releaseDraft: true
          prerelease: false

      - name: Generate installer checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installers = @(Get-ChildItem "src-tauri/target/release/bundle" -Recurse -File |
            Where-Object { $_.Extension -eq ".exe" })
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows .exe installer, found $($installers.Count)."
          }

          $installer = $installers[0]
          $version = "${{ github.ref_name }}".TrimStart("v")
          $assetName = "Mod-Garrison_${version}_x64-setup.exe"
          $remoteInstallers = @(gh release view "${{ github.ref_name }}" --json assets --jq '.assets[].name' |
            Where-Object { $_ -like "*.exe" })
          if ($remoteInstallers.Count -ne 1 -or $remoteInstallers[0] -ne $assetName) {
            throw "Expected the single release installer '$assetName', found: $($remoteInstallers -join ', ')"
          }

          $checksumDirectory = Join-Path $env:RUNNER_TEMP "mod-garrison-checksum"
          New-Item -ItemType Directory -Path $checksumDirectory -Force | Out-Null
          $checksumPath = Join-Path $checksumDirectory "$assetName.sha256"
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $assetName" | Set-Content -LiteralPath $checksumPath -Encoding ascii
          gh release upload "${{ github.ref_name }}" $checksumPath --clobber

          $expectedAssets = @($assetName, "$assetName.sha256") | Sort-Object
          $actualAssets = @(gh release view "${{ github.ref_name }}" --json assets --jq '.assets[].name') |
            Sort-Object
          if (Compare-Object $expectedAssets $actualAssets) {
            throw "Release assets did not match the expected installer and checksum: $($actualAssets -join ', ')"
          }

      - name: Publish complete release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --latest
