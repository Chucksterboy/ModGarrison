name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend
        run: pnpm run typecheck

      - name: Test frontend
        run: pnpm run test:frontend

      - name: Test backend
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Lint backend
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build Mod Garrison
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MOD_GARRISON_MODIO_API_KEY: ${{ secrets.MOD_GARRISON_MODIO_API_KEY }}
          MOD_GARRISON_MODIO_API_BASE: ${{ vars.MOD_GARRISON_MODIO_API_BASE }}
        with:
          args: --features custom-protocol --bundles nsis
          assetNamePattern: "Mod-Garrison_[version]_[arch][setup][ext]"
          tagName: ${{ github.ref_name }}
          releaseName: "Mod Garrison ${{ github.ref_name }}"
          releaseBody: |
            Mod Garrison ${{ github.ref_name }} for Windows.

            - Fixes misleading Refresh and Discover warnings when mod.io has no matching catalogue for a game. Successful Nexus searches and healthy mod installations no longer appear incomplete because an optional provider has no catalogue.
            - Keeps actual provider connection, authentication, ambiguous-match, and saved-mapping errors visible. Selecting mod.io explicitly still explains when no verified catalogue is available.
            - Stops caching failed provider lookups as empty results, so repeated failures remain visible and retries can recover immediately.
            - Relearns older cached route metadata to clear obsolete catalogue warnings while preserving package-verified install routes.
            - Preserves existing profiles, settings, installed mods, and Enshrouded configuration support.
            - Publishes one Windows NSIS `.exe` installer and its SHA-256 checksum.

            Validation: 355 backend tests and 88 frontend tests passed, covering optional catalogue misses, real provider failures, saved mappings, retry caching, and discovery status messages.
          releaseDraft: true
          prerelease: false

      - name: Generate installer checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installers = @(Get-ChildItem "src-tauri/target/release/bundle" -Recurse -File |
            Where-Object { $_.Extension -eq ".exe" })
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows .exe installer, found $($installers.Count)."
          }

          $installer = $installers[0]
          $version = "${{ github.ref_name }}".TrimStart("v")
          $assetName = "Mod-Garrison_${version}_x64-setup.exe"
          $remoteInstallers = @(gh release view "${{ github.ref_name }}" --json assets --jq '.assets[].name' |
            Where-Object { $_ -like "*.exe" })
          if ($remoteInstallers.Count -ne 1 -or $remoteInstallers[0] -ne $assetName) {
            throw "Expected the single release installer '$assetName', found: $($remoteInstallers -join ', ')"
          }

          $checksumDirectory = Join-Path $env:RUNNER_TEMP "mod-garrison-checksum"
          New-Item -ItemType Directory -Path $checksumDirectory -Force | Out-Null
          $checksumPath = Join-Path $checksumDirectory "$assetName.sha256"
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $assetName" | Set-Content -LiteralPath $checksumPath -Encoding ascii
          gh release upload "${{ github.ref_name }}" $checksumPath --clobber

          $expectedAssets = @($assetName, "$assetName.sha256") | Sort-Object
          $actualAssets = @(gh release view "${{ github.ref_name }}" --json assets --jq '.assets[].name') |
            Sort-Object
          if (Compare-Object $expectedAssets $actualAssets) {
            throw "Release assets did not match the expected installer and checksum: $($actualAssets -join ', ')"
          }

      - name: Publish complete release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --latest
