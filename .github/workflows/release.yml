name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend
        run: pnpm run typecheck

      - name: Test backend
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Lint backend
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build Mod Garrison
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --features custom-protocol
          tagName: ${{ github.ref_name }}
          releaseName: "Mod Garrison ${{ github.ref_name }}"
          releaseBody: |
            Mod Garrison ${{ github.ref_name }} for Windows.

            - Repairs update compatibility across the UniLoader-to-Mod Garrison repository and release-asset rename.
            - Refreshes release metadata immediately before downloading an update.
            - Replaces the undersized Windows taskbar icon with a larger, sharper fortress mark while preserving the system-tray icon.
            - Existing UniLoader profiles, settings, Nexus credentials, portable profile bundles, and installation upgrades remain compatible.
          releaseDraft: true
          prerelease: false

      - name: Generate checksums and stable update aliases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installers = Get-ChildItem "src-tauri/target/release/bundle" -Recurse -File |
            Where-Object { $_.Extension -in @(".exe", ".msi") }
          if (-not $installers) { throw "No Windows installer was produced." }

          $aliasDirectory = Join-Path $env:RUNNER_TEMP "mod-garrison-release-assets"
          New-Item -ItemType Directory -Path $aliasDirectory -Force | Out-Null

          foreach ($installer in $installers) {
            $checksumPath = "$($installer.FullName).sha256"
            $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($installer.Name)" | Set-Content -LiteralPath $checksumPath -Encoding ascii
            gh release upload "${{ github.ref_name }}" $checksumPath --clobber

            if ($installer.Name -notmatch "^Mod(?: Garrison|\.Garrison|-Garrison|_Garrison|Garrison)_(.+)$") {
              throw "Unexpected installer name: $($installer.Name)"
            }
            # GitHub normalizes spaces in release asset names. Keep a stable alias
            # that deployed Mod Garrison updaters can select without ambiguity.
            $aliasName = "Mod-Garrison_$($Matches[1])"
            $aliasPath = Join-Path $aliasDirectory $aliasName
            Copy-Item -LiteralPath $installer.FullName -Destination $aliasPath -Force
            $aliasChecksumPath = "$aliasPath.sha256"
            "$hash  $aliasName" | Set-Content -LiteralPath $aliasChecksumPath -Encoding ascii
            gh release upload "${{ github.ref_name }}" $aliasPath $aliasChecksumPath --clobber
          }

      - name: Publish complete release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --latest
