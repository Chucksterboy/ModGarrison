name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend
        run: pnpm run typecheck

      - name: Test frontend
        run: pnpm run test:frontend

      - name: Test backend
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Lint backend
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Build Mod Garrison
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MOD_GARRISON_MODIO_API_KEY: ${{ secrets.MOD_GARRISON_MODIO_API_KEY }}
          MOD_GARRISON_MODIO_API_BASE: ${{ vars.MOD_GARRISON_MODIO_API_BASE }}
        with:
          args: --features custom-protocol --bundles nsis
          assetNamePattern: "Mod-Garrison_[version]_[arch][setup][ext]"
          tagName: ${{ github.ref_name }}
          releaseName: "Mod Garrison ${{ github.ref_name }}"
          releaseBody: |
            Mod Garrison ${{ github.ref_name }} for Windows.

            - Adds Enshrouded support for recognized EML mod folders, Shroudtopia native plugins, and native root packages, preserving complete companion folders and Windows-style archive paths.
            - Automatically provisions supported EML, maintained Shroudtopia, and ModLoader Proxy dependencies from verified official release assets.
            - Manages shared native loaders without moving their companion files, reuses identical bundled loader DLLs, and preserves unrelated chainloader settings.
            - Captures original Enshrouded patch data and restores it during managed disable, clean launch, and removal operations. Automatically installed dependencies are removed when no managed mod needs them.
            - Adds Max Stack configuration through the cogwheel, including its four main settings and editable or new per-item stack overrides. Saving EML settings triggers repatching on the next game startup.
            - Journals Enshrouded installs, loader configuration, ownership, and cleanup so failed changes can roll back without discarding user settings or another mod's files.
            - Documents 25 author installation workflows and the supported layouts. Archive and regression checks do not establish that every researched mod or mod combination works in-game.
            - Publishes one Windows NSIS `.exe` installer and its SHA-256 checksum.

            Validation: 345 backend tests and 86 frontend tests passed. See the Enshrouded support document in the repository for requirements and compatibility limits.
          releaseDraft: true
          prerelease: false

      - name: Generate installer checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installers = @(Get-ChildItem "src-tauri/target/release/bundle" -Recurse -File |
            Where-Object { $_.Extension -eq ".exe" })
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows .exe installer, found $($installers.Count)."
          }

          $installer = $installers[0]
          $version = "${{ github.ref_name }}".TrimStart("v")
          $assetName = "Mod-Garrison_${version}_x64-setup.exe"
          $remoteInstallers = @(gh release view "${{ github.ref_name }}" --json assets --jq '.assets[].name' |
            Where-Object { $_ -like "*.exe" })
          if ($remoteInstallers.Count -ne 1 -or $remoteInstallers[0] -ne $assetName) {
            throw "Expected the single release installer '$assetName', found: $($remoteInstallers -join ', ')"
          }

          $checksumDirectory = Join-Path $env:RUNNER_TEMP "mod-garrison-checksum"
          New-Item -ItemType Directory -Path $checksumDirectory -Force | Out-Null
          $checksumPath = Join-Path $checksumDirectory "$assetName.sha256"
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $assetName" | Set-Content -LiteralPath $checksumPath -Encoding ascii
          gh release upload "${{ github.ref_name }}" $checksumPath --clobber

          $expectedAssets = @($assetName, "$assetName.sha256") | Sort-Object
          $actualAssets = @(gh release view "${{ github.ref_name }}" --json assets --jq '.assets[].name') |
            Sort-Object
          if (Compare-Object $expectedAssets $actualAssets) {
            throw "Release assets did not match the expected installer and checksum: $($actualAssets -join ', ')"
          }

      - name: Publish complete release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --latest
